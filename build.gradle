plugins {
    id 'java'
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.4.20'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.20'
}

group = 'com.survivalcoding'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
    // JSON for configuration
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Kotlin Serialization
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.0'
    
    // Ktor Client
    implementation 'io.ktor:ktor-client-core:2.3.7'
    implementation 'io.ktor:ktor-client-cio:2.3.7'
    testImplementation 'io.ktor:ktor-client-mock:2.3.7'
    
    // JavaFX 네이티브 라이브러리는 OS·아키텍처마다 다르므로 실행 환경에 맞는 classifier 를 고른다.
    // (예: linux 네이티브로 빌드한 뒤 Windows 에서 실행하면 UnsatisfiedLinkError 가 발생한다.)
    def osName = System.getProperty('os.name').toLowerCase()
    def osArch = System.getProperty('os.arch').toLowerCase()
    def arm64 = osArch.contains('aarch64') || osArch.contains('arm64')
    def javafxPlatform = osName.contains('win') ? 'win'
            : osName.contains('mac') ? (arm64 ? 'mac-aarch64' : 'mac')
            : (arm64 ? 'linux-aarch64' : 'linux')
    implementation "org.openjfx:javafx-controls:21.0.2:$javafxPlatform"
    implementation "org.openjfx:javafx-graphics:21.0.2:$javafxPlatform"
    implementation "org.openjfx:javafx-fxml:21.0.2:$javafxPlatform"
    implementation "org.openjfx:javafx-media:21.0.2:$javafxPlatform"
    implementation "org.openjfx:javafx-base:21.0.2:$javafxPlatform"
}

tasks.withType(JavaCompile).configureEach {
    // 소스에 포함된 한글이 플랫폼 기본 인코딩(예: Windows CP949)에 관계없이 유지되도록 고정한다.
    options.encoding = 'UTF-8'
}

// day12-asset 는 src/main/java 안에 중첩된 별도 Gradle 프로젝트다.
// 제외하지 않으면 부모 빌드가 그 프로젝트의 테스트 소스까지 main 소스로 컴파일해 빌드가 실패한다.
sourceSets {
    main {
        // 18day 패키지만 포함 (다른 day 패키지는 선행 버그로 컴파일 불가)
        kotlin.srcDirs = ['src/main/KotlinMain/src/com/survivalcoding/18day']
        kotlin {
            // ImageDataSource.kt 는 기존 선행 버그(bodyAsBytes)로 컴파일 불가하므로 제외
            exclude 'Data_source/ImageDataSource.kt'
            exclude 'Data_source/RemotePokemonDataSource.kt'
        }
        java {
            exclude 'com/survivalcoding/day12_abstract_interface/day12-asset/**'
        }
    }
    test {
        kotlin.srcDirs = ['src/main/KotlinMain/test']
        kotlin {
            // 18day 패키지만 포함 (다른 day 패키지는 선행 버그로 컴파일 불가)
            include 'com/survivalcoding/18day/**'
        }
    }
}

test {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
}

application {
    mainClass = 'com.survivalcoding.18day.PokemonGameApp'
    
    // JavaFX module path from the downloaded dependencies
    applicationDefaultJvmArgs = [
        '--module-path', "${configurations.runtimeClasspath.files.collect { it.absolutePath }.join(File.pathSeparator)}",
        '--add-modules', 'javafx.controls,javafx.graphics,javafx.fxml,javafx.media',
        '-Dfile.encoding=UTF-8'
    ]
}

tasks.register('runPokemonGame', JavaExec) {
    group = 'application'
    description = 'Runs the Pokemon game with image and sound (JavaFX GUI).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.survivalcoding.18day.PokemonGameApp'
    systemProperty 'file.encoding', 'UTF-8'

    // JavaFX 모듈 경로 및 모듈 추가 (GUI 실행에 필요함)
    def osName = System.getProperty('os.name').toLowerCase()
    def osArch = System.getProperty('os.arch').toLowerCase()
    def arm64 = osArch.contains('aarch64') || osArch.contains('arm64')
    def javafxPlatform = osName.contains('win') ? 'win'
            : osName.contains('mac') ? (arm64 ? 'mac-aarch64' : 'mac')
            : (arm64 ? 'linux-aarch64' : 'linux')

    jvmArgs = [
        '--module-path', configurations.runtimeClasspath.files.collect { it.absolutePath }.join(File.pathSeparator),
        '--add-modules', 'javafx.controls,javafx.graphics,javafx.fxml,javafx.media',
        '-Dfile.encoding=UTF-8'
    ]
}
